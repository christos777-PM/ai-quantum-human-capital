name: Benchmark evaluator CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate synthetic benchmark
        run: |
          python scripts/evaluate_benchmark.py \
            --gold data/benchmark/example.jsonl \
            --predictions data/benchmark/example_predictions.jsonl \
            --output /tmp/benchmark-report.json
      - name: Check expected smoke-test metrics
        run: |
          python -c "import json; report=json.load(open('/tmp/benchmark-report.json', encoding='utf-8')); assert report['records_evaluated'] == 2; assert report['micro']['f1'] == 0.7692; assert report['macro_f1'] == 0.7619; print('Synthetic benchmark smoke test passed')"
