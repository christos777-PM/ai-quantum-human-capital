name: Research benchmark CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test annotation taxonomy and evidence validation
        run: |
          python scripts/validate_annotations.py --input data/benchmark/annotation-example.jsonl
      - name: Smoke-test split leakage validator
        run: |
          python scripts/validate_splits.py \
            --development data/benchmark/splits/development.example.jsonl \
            --held-out data/benchmark/splits/held_out.example.jsonl
      - name: Smoke-test provenance manifest validation and release gate
        run: |
          python scripts/validate_manifest.py --input data/benchmark/manifest.template.json
          python -c "import subprocess; result=subprocess.run(['python', 'scripts/validate_manifest.py', '--input', 'data/benchmark/manifest.template.json', '--require-release-ready'], capture_output=True, text=True); assert result.returncode == 1, f'Expected the template to be blocked from empirical release; got {result.returncode}: {result.stderr}'; print('Template correctly blocked from empirical release')"
      - name: Smoke-test pairwise annotation agreement
        run: |
          python scripts/compare_annotations.py \
            --annotator-a data/benchmark/annotator-a.example.jsonl \
            --annotator-b data/benchmark/annotator-b.example.jsonl \
            --output /tmp/annotation-agreement.json
          python -c "import json; report=json.load(open('/tmp/annotation-agreement.json', encoding='utf-8')); assert report['records_compared'] == 3; assert report['exact_set_agreement'] == 0.6667; assert report['mean_role_jaccard'] == 0.8333; assert report['micro_jaccard'] == 0.75; print('Synthetic annotation-agreement smoke test passed')"
      - name: Smoke-test benchmark evaluator
        run: |
          python scripts/evaluate_benchmark.py \
            --gold data/benchmark/example.jsonl \
            --predictions data/benchmark/example_predictions.jsonl \
            --output /tmp/benchmark-report.json
          python -c "import json; report=json.load(open('/tmp/benchmark-report.json', encoding='utf-8')); assert report['records_evaluated'] == 2; assert report['micro']['f1'] == 0.7692; assert report['macro_f1'] == 0.7619; print('Synthetic benchmark smoke test passed')"
